name: Codex Security Review completion

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  security-review-completed:
    name: Codex Security Review (required)
    if: true
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Verify Codex reviewed this PR head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          """Require Codex's authenticated security-review receipt for a PR head.

          This checks completion, not the absence of vulnerabilities. The v1 receipt
          format is supplied by the Codex GitHub integration; an unrecognized format
          must block rather than silently treating the review as complete.
          """

          import json
          import os
          import re
          import sys
          import time
          import urllib.request

          CODEX_BOT_ID = 199175422


          def trusted_bot(actor):
              return (
                  isinstance(actor, dict)
                  and actor.get("__typename") == "Bot"
                  and actor.get("databaseId") == CODEX_BOT_ID
              )


          def completed_receipt(comment, repository, number, head):
              if not trusted_bot(comment.get("author")):
                  return False
              if "lastEditedAt" not in comment or "editor" not in comment:
                  return False
              # Repository writers can edit another account's comment. Read body and
              # editor together from GraphQL so a copied or edited receipt cannot pass.
              editor = comment["editor"]
              if editor is not None and not trusted_bot(editor):
                  return False
              if comment["lastEditedAt"] is not None and not trusted_bot(editor):
                  return False
              body = comment.get("body") or ""
              match = re.search(r"<!-- codex-security-review:v1 (\{[^\n]*\}) -->", body)
              if not match:
                  return False
              try:
                  receipt = json.loads(match.group(1))
              except (json.JSONDecodeError, TypeError):
                  return False
              return (
                  isinstance(receipt, dict)
                  and receipt.get("repository") == repository
                  and receipt.get("pullRequestNumber") == number
                  and receipt.get("headSha") == head
                  and receipt.get("status") == "completed"
              )


          def main():
              with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as source:
                  event = json.load(source)
              repository = os.environ["GITHUB_REPOSITORY"]
              pr = event["pull_request"]
              number, head = pr["number"], pr["head"]["sha"]
              if pr["base"]["repo"]["full_name"] != repository:
                  raise RuntimeError("The event does not belong to this repository")
              api = os.environ["GITHUB_API_URL"].rstrip("/")
              token = os.environ["GH_TOKEN"]

              def read(path):
                  request = urllib.request.Request(
                      api + path,
                      headers={
                          "Authorization": "Bearer " + token,
                          "Accept": "application/vnd.github+json",
                          "X-GitHub-Api-Version": "2022-11-28",
                          "User-Agent": "Backflip-Codex-security-completion-check",
                      },
                  )
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)

              def verified_comments(ids):
                  query = """query($ids: [ID!]!) {
                    nodes(ids: $ids) {
                      ... on IssueComment {
                        body lastEditedAt
                        author { __typename login ... on Bot { databaseId } }
                        editor { __typename login ... on Bot { databaseId } }
                      }
                    }
                  }"""
                  request = urllib.request.Request(
                      os.environ["GITHUB_GRAPHQL_URL"],
                      data=json.dumps({"query": query, "variables": {"ids": ids}}).encode(),
                      headers={
                          "Authorization": "Bearer " + token,
                          "Content-Type": "application/json",
                          "User-Agent": "Backflip-Codex-security-completion-check",
                      },
                  )
                  with urllib.request.urlopen(request, timeout=30) as response:
                      result = json.load(response)
                  if result.get("errors") or not isinstance(result.get("data", {}).get("nodes"), list):
                      raise RuntimeError("GitHub could not verify the receipt author and editor")
                  return [comment for comment in result["data"]["nodes"] if comment is not None]

              pr_path = f"/repos/{repository}/pulls/{number}"
              deadline = time.monotonic() + 1800
              print(f"Waiting for Codex Security Review of {repository}#{number} at {head}", flush=True)
              while time.monotonic() < deadline:
                  current = read(pr_path)
                  if current["state"] != "open" or current["head"]["sha"] != head:
                      raise RuntimeError("PR closed or head changed; this run cannot approve the new head")
                  page = 1
                  found = False
                  while True:
                      comments = read(f"/repos/{repository}/issues/{number}/comments?per_page=100&page={page}")
                      candidates = [
                          c["node_id"] for c in comments
                          if (c.get("user") or {}).get("id") == CODEX_BOT_ID
                          and "codex-security-review:v1" in (c.get("body") or "")
                      ]
                      found = bool(candidates) and any(
                          completed_receipt(c, repository, number, head)
                          for c in verified_comments(candidates)
                      )
                      if found or len(comments) < 100:
                          break
                      page += 1
                  if found:
                      if read(pr_path)["head"]["sha"] != head:
                          raise RuntimeError("PR head changed while checking the receipt")
                      print("Codex Security Review completed for this PR head.", flush=True)
                      return
                  time.sleep(15)
              raise RuntimeError("No completed Codex Security Review for this head within 30 minutes. Re-run after completion, or use the authorized PR bypass.")


          if __name__ == "__main__":
              try:
                  main()
              except Exception as error:
                  print(f"Security review completion check failed: {error}", file=sys.stderr)
                  sys.exit(1)
